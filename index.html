<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PF팀 딜 포탈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#13294b; --navy2:#1c3765; --bg:#f3f5f8; --card:#fff; --line:#dfe3ea; --line2:#eceff4;
  --ink:#1b2533; --ink2:#5b6676; --ink3:#8a94a3; --accent:#2f6fde; --accent-bg:#eaf1fd;
  --bad:#c8402f; --bad-bg:#fbecea; --warn:#b7791f; --warn-bg:#fdf3e2; --good:#2e7d4f; --good-bg:#e7f4ec;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
.side{width:220px;flex:none;background:var(--navy);color:#cfd8e6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:-.2px}
.brand span{font-size:12px;color:#8fa1bd}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:6px;color:#cfd8e6;text-decoration:none;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--navy2);color:#fff;font-weight:500}
.nav .cnt{font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:10px}
.side-foot{margin-top:auto;padding:16px 20px;font-size:12px;color:#8fa1bd;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:18px 28px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.3px}
.top .sub{font-size:12px;color:var(--ink3)}
.top .sp{flex:1}
.sync{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.dot.ok{background:var(--good)} .dot.err{background:var(--bad)}
.view{padding:24px 28px 60px}
.banner{margin:0 0 16px;padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:#7a5212;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 13px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#c4cbd6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.danger{color:var(--bad);border-color:#efc9c3}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card h3{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between}
.card .bd{padding:14px 16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:2fr 1fr}
.kpi{padding:16px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.kpi .v small{font-size:13px;font-weight:400;color:var(--ink3);margin-left:3px}
.kpi.hl .v{color:var(--accent)}
.bars .row{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bars .trk{height:14px;background:var(--line2);border-radius:3px;overflow:hidden}
.bars .fill{height:100%;background:var(--navy2);border-radius:3px}
.bars .gate{font-size:11px;color:var(--accent);margin:2px 0 2px 0;padding-left:128px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--ink2);background:#f8f9fb;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.clk{cursor:pointer} .t tr.clk:hover td{background:#f8fafd}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)} .small{font-size:12px}
.empty{padding:28px 16px;text-align:center;color:var(--ink3);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tag.acc{background:var(--accent-bg);color:var(--accent)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.good{background:var(--good-bg);color:var(--good)}
.over{color:var(--bad);font-weight:500}
/* kanban */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:#fff;font-size:13px}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 212px;background:#e9edf2;border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col.dragover{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{padding:10px 12px;font-size:13px;font-weight:500;display:flex;justify-content:space-between}
.col-h span{color:var(--ink3);font-weight:400}
.col-b{padding:0 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:60px}
.gatesep{flex:0 0 26px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:11px;color:var(--accent);letter-spacing:1px;border-left:2px dashed #b9cbef;margin:0 2px;padding:6px 0}
.dc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;font-size:12.5px}
.dc:hover{border-color:#b7c2d3}
.dc .c{font-size:11px;color:var(--ink3)}
.dc .n{font-weight:500;font-size:13.5px;margin:2px 0 6px;line-height:1.35}
.dc .m{display:flex;justify-content:space-between;color:var(--ink2);gap:6px}
.dc.hold{border-left:3px solid var(--warn)}
/* deal page */
.dhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.dhead .t1{font-size:12px;color:var(--ink3)}
.dhead h2{margin:2px 0 6px;font-size:21px;letter-spacing:-.4px}
.dhead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stepper{display:flex;align-items:center;gap:0;margin:0 0 16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto}
.st{display:flex;flex-direction:column;align-items:center;min-width:92px;font-size:12px;color:var(--ink3);text-align:center}
.st i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;margin-bottom:5px;background:#fff}
.st.done i{background:var(--navy2);border-color:var(--navy2);color:#fff}
.st.cur i{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.st.cur{color:var(--ink);font-weight:500}
.st.done{color:var(--ink2)}
.ln{flex:1;min-width:14px;height:2px;background:var(--line);margin-bottom:20px}
.ln.done{background:var(--navy2)}
.gd{width:16px;height:16px;transform:rotate(45deg);border:2px solid var(--accent);background:#fff;margin:0 6px 20px;flex:none}
.gd.go{background:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.metrics div{padding:12px 16px;border-right:1px solid var(--line2)}
.metrics div:last-child{border-right:0}
.metrics .l{font-size:11.5px;color:var(--ink2)} .metrics .v{font-size:17px;font-weight:700;margin-top:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px;cursor:pointer}
.tabs a.on{color:var(--ink);border-color:var(--navy);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.kv div{padding:10px 0;border-bottom:1px solid var(--line2);padding-right:16px}
.kv .l{font-size:11.5px;color:var(--ink3)} .kv .v{margin-top:2px;white-space:pre-wrap;word-break:break-all}
.kv .wide{grid-column:1/-1}
/* forms */
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.f{display:flex;flex-direction:column;gap:5px}
.f.wide{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--ink2)}
.f label .req{color:var(--bad)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;width:100%}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.cl select:focus,.cl input:focus,.fe input:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.f .hint{font-size:11.5px;color:var(--ink3)}
.dup{grid-column:1/-1;background:var(--warn-bg);border-radius:6px;padding:10px 12px;font-size:13px;color:#6f4b10}
.formfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
/* checklist */
.cl{width:100%;border-collapse:collapse}
.cl td,.cl th{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:13px;text-align:left}
.cl th{font-weight:500;color:var(--ink2);background:#f8f9fb}
.cl select,.cl input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
.cl select.v-적합{color:var(--good)} .cl select.v-보완{color:var(--warn)} .cl select.v-부적합{color:var(--bad);font-weight:500}
.gatebox{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:10px}
.gatebox .gd{margin:0}
.gatebox .tx{flex:1;font-size:13px}
/* feas */
.fe{width:100%;border-collapse:collapse}
.fe th,.fe td{padding:7px 10px;border-bottom:1px solid var(--line2);font-size:13px}
.fe th{text-align:left;font-weight:500;color:var(--ink2);background:#f8f9fb}
.fe td.n{text-align:right}
.fe input{width:120px;text-align:right;border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-variant-numeric:tabular-nums}
.fe tr.calc td{background:#f8fafd;font-weight:500}
.fe tr.sec td{font-size:11.5px;color:var(--ink3);background:#fff;padding-top:12px}
.formula{font-size:12px;color:var(--ink2);line-height:1.8;margin-top:12px}
.formula code{background:var(--line2);padding:1px 5px;border-radius:3px;font-size:11.5px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.log .w{width:128px;flex:none;color:var(--ink3);font-size:12px}
/* modal & toast */
.mask{position:fixed;inset:0;background:rgba(15,27,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:50;overflow:auto}
.mask.hidden{display:none}
.dlg{background:#fff;border-radius:10px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.dlg h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line2);font-size:16px}
.dlg .bd{padding:18px 20px}
.dlg .ft{padding:12px 20px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}
.radios{display:flex;gap:8px}
.radios label{flex:1;border:1px solid var(--line);border-radius:6px;padding:9px;text-align:center;cursor:pointer;font-size:13px}
.radios input{display:none}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:500}
.note{font-size:12.5px;padding:9px 12px;border-radius:6px;background:var(--line2);margin-bottom:12px}
.note.bad{background:var(--bad-bg);color:var(--bad)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
.ro .wr{display:none!important}
@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static}
  .nav{flex-direction:row;overflow-x:auto}
  .side-foot,.brand span{display:none}
  .g4{grid-template-columns:1fr 1fr} .g2,.g3{grid-template-columns:1fr}
  .form{grid-template-columns:1fr} .kv{grid-template-columns:1fr 1fr}
  .metrics{grid-template-columns:1fr 1fr}
  .view,.top{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>PF Deal Portal</b><span>부동산프로젝트금융팀</span></div>
    <nav class="nav" id="nav">
      <a href="#dashboard" data-r="dashboard">대시보드</a>
      <a href="#intake" data-r="intake" class="wr">딜 접수</a>
      <a href="#pipeline" data-r="pipeline">딜 파이프라인 <span class="cnt" id="cntPipe">0</span></a>
      <a href="#library" data-r="library">자료실 <span class="cnt" id="cntFile">0</span></a>
      <a href="#archive" data-r="archive">Drop 아카이브 <span class="cnt" id="cntDrop">0</span></a>
    </nav>
    <div class="side-foot">
      <div>사용자: <b id="meName" style="color:#fff">–</b> <button class="link" id="btnUser" style="color:#9fc0f5;font-size:12px">변경</button></div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn sm" id="btnExport" style="background:transparent;color:#cfd8e6;border-color:#3a5480">백업 내보내기</button>
        <button class="btn sm" id="btnImport" style="background:transparent;color:#cfd8e6;border-color:#3a5480">백업 불러오기</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
      <div style="margin-top:10px">로컬 저장 버전 · 1단계 MVP</div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="pageTitle">대시보드</h1><div class="sub" id="pageSub"></div></div>
      <div class="sp"></div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTx">연결 중…</span></div>
      <a class="btn pri wr" href="#intake" style="text-decoration:none">+ 새 딜 접수</a>
    </header>
    <section class="view" id="view"></section>
  </div>
</div>
<div class="mask hidden" id="mask"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>

<script>
/* ===================== 상수 ===================== */
const STAGES=['접수','1차 스크리닝','개발 기획','사업수지 검토','IM·수지표 작성','투자자·대주 모집','클로징'];
const REQ_TYPES=['개발의뢰','PF의뢰','매입·매각','기타'];
const ASSET_TYPES=['물류','주거','오피스','데이터센터','복합','기타'];
const DOC_TYPES=['등기부등본','토지이용계획확인서','감정평가서','설계안·배치도','수지표','IM·티저','계약서','사진·지도','기타'];
const SOURCES=['의뢰인 제공','자체 작성','외부기관'];
const DROP_CODES=['사업성','인허가','권리관계','신용·시공사','조건불일치','기타'];
const CK_VALS=['미검토','적합','보완','부적합'];
const CHECK=[
  {k:'permit',t:'인허가',p:'용도지역·지구단위계획, 법정 건폐율·용적률, 계획 용도 허용 여부, 인허가 단계'},
  {k:'land',t:'토지확보',p:'소유권, 매입계약·확보율, 근저당·가압류·지상권 등 권리침해'},
  {k:'market',t:'분양·임대',p:'인근 실거래가·분양가·임대료, 공실률, 공급예정 물량'},
  {k:'builder',t:'시공사',p:'신용등급, 책임준공·연대보증 가능 여부'},
  {k:'cost',t:'공사비',p:'평당 공사비 적정성, 물가변동 조항'},
  {k:'rate',t:'금리·조달',p:'필요 조달액, 트랜치 구조, 금리 수준'},
  {k:'exit',t:'Exit',p:'분양형: 선순위 상환 분양률 / 임대형: 준공 후 매각·리파이낸싱'}
];
const FEAS=[
  {sec:'매출·비용 (억원)'},
  {k:'rev',t:'총매출'},{k:'cost',t:'총사업비'},{k:'land',t:'  └ 토지비'},{k:'build',t:'  └ 공사비'},
  {sec:'조달 구조 (억원)'},
  {k:'sr',t:'선순위 PF'},{k:'mz',t:'중순위'},{k:'jr',t:'후순위'},{k:'eq',t:'자기자본'},
  {sec:'담보·상환 (억원)'},
  {k:'coll',t:'담보가치(감정가)'},{k:'srpay',t:'선순위 원리금+우선지급비용'}
];
const today=()=>new Date().toLocaleDateString('sv-SE');
const now=()=>new Date().toISOString();

/* ===================== 상태 ===================== */
const S={db:null,user:null,assets:null,me:null,canWrite:null,canAdmin:false,
  deals:[],files:[],members:[],names:{},loaded:{deals:false,files:false},
  dirty:false,pending:false,tab:'overview',editOverview:false,
  filt:{q:'',asset:'',owner:''},libf:{deal:'',type:''}};

/* ===================== 유틸 ===================== */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(arr,sel,blank)=>(blank!==undefined?`<option value="">${esc(blank)}</option>`:'')+arr.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:null};
const fmt=(v,d=1)=>v==null||!isFinite(v)?'–':v.toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:0});
const pct=v=>v==null||!isFinite(v)?'–':(v*100).toFixed(1)+'%';
const dshort=s=>s?s.slice(2,10).replace(/-/g,'.'):'';
const dtime=s=>{if(!s)return'';const d=new Date(s);return d.toLocaleDateString('sv-SE').slice(2).replace(/-/g,'.')+' '+d.toTimeString().slice(0,5)};
const daysTo=s=>s?Math.round((Date.parse(s)-Date.parse(today()))/864e5):null;
const nameOf=id=>id?(S.names[id]||'팀원'):'미지정';
const deal=id=>S.deals.find(d=>d.id===id);
const norm=s=>String(s||'').replace(/\s|-|번지/g,'');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)}
function setSync(state,tx){$('#syncDot').className='dot '+(state||'');$('#syncTx').textContent=tx}
function errMsg(e){const c=e&&e.code;if(c==='invalid_argument')return'저장 권한이 없거나 입력이 올바르지 않습니다';if(c==='quota_exceeded')return'저장 공간 한도에 도달했습니다';if(c==='resource_exhausted')return'요청이 많습니다. 잠시 후 다시 시도하세요';return'저장 실패: 잠시 후 다시 시도하세요'}
function feasCalc(x){x=x||{};const g=k=>num(x[k]);const rev=g('rev'),cost=g('cost'),sr=g('sr'),mz=g('mz'),jr=g('jr'),coll=g('coll'),srpay=g('srpay');
  const pf=[sr,mz,jr].every(v=>v==null)?null:(sr||0)+(mz||0)+(jr||0);
  return{profit:rev!=null&&cost!=null?rev-cost:null,margin:rev&&cost!=null?(rev-cost)/rev:null,pf,
    ltv:sr!=null&&coll?sr/coll:null,bep:srpay!=null&&rev?srpay/rev:null}}

/* ===================== 렌더 스케줄 (입력 중 보호) ===================== */
function scheduleRender(){const a=document.activeElement;
  if(S.dirty||(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){S.pending=true;return}
  render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pending&&!S.dirty)scheduleRender()},0));
function setDirty(v){S.dirty=v;if(!v&&S.pending){S.pending=false;render()}}

/* ===================== 라우팅 ===================== */
function route(){const h=location.hash.slice(1)||'dashboard';
  if(h.startsWith('deal-'))return{name:'deal',id:h.slice(5)};
  return{name:['dashboard','intake','pipeline','library','archive'].includes(h)?h:'dashboard'}}
window.addEventListener('hashchange',()=>{S.dirty=false;S.pending=false;S.editOverview=false;S.tab='overview';render();window.scrollTo(0,0)});

function render(){S.pending=false;const r=route();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r.name||(r.name==='deal'&&a.dataset.r==='pipeline')));
  const live=S.deals.filter(d=>d.status!=='Drop'&&d.status!=='종결');
  $('#cntPipe').textContent=live.length;$('#cntFile').textContent=S.files.length;$('#cntDrop').textContent=S.deals.filter(d=>d.status==='Drop').length;
  const v=$('#view');let title='',sub='',html='';
  const banner=bannerHtml();
  if(r.name==='dashboard'){title='대시보드';sub=`기준일 ${today()}`;html=viewDashboard()}
  else if(r.name==='intake'){title='딜 접수';sub='외부 개발·PF 의뢰 등록';html=viewIntake()}
  else if(r.name==='pipeline'){title='딜 파이프라인';sub='7단계 · Gate 2개 · 카드를 끌어 단계 이동';html=viewPipeline()}
  else if(r.name==='library'){title='자료실';sub='딜별 문서 · 버전 · 표준 파일명';html=viewLibrary()}
  else if(r.name==='archive'){title='Drop 아카이브';sub='Drop 사유 기록 · 재유입 시 중복 검색';html=viewArchive()}
  else if(r.name==='deal'){const d=deal(r.id);title=d?d.name:'딜을 찾을 수 없음';sub=d?d.code:'';html=d?viewDeal(d):(S.loaded.deals?'<div class="card empty">삭제되었거나 존재하지 않는 딜입니다. <a href="#pipeline">파이프라인으로</a></div>':'<div class="card empty">불러오는 중…</div>')}
  $('#pageTitle').textContent=title;$('#pageSub').textContent=sub;
  v.innerHTML=banner+html;
  document.body.classList.toggle('ro',S.canWrite===false||!S.db);
  if(r.name==='intake')initIntake();
  if(r.name==='pipeline')initKanban();
}
function bannerHtml(){
  if(!S.db&&S.dbChecked)return'<div class="banner">공유 저장소에 연결되지 않았습니다. 로그인 상태를 확인하세요. 지금은 화면만 볼 수 있습니다.</div>';
  if(S.canWrite===false)return'<div class="banner">보기 전용 권한입니다. 등록·수정하려면 소유자에게 Contributor 이상 권한을 요청하세요.</div>';
  if(S.pending)return'';
  return''}

/* ===================== 대시보드 ===================== */
function viewDashboard(){
  const live=S.deals.filter(d=>d.status==='진행'||d.status==='보류');
  const hold=live.filter(d=>d.status==='보류').length;
  const ym=today().slice(0,7);
  const newM=S.deals.filter(d=>(d.createdAt||'').slice(0,7)===ym).length;
  const due=live.map(d=>({d,dd:d.nextDue||d.dueDate})).filter(x=>x.dd&&daysTo(x.dd)<=7).sort((a,b)=>a.dd<b.dd?-1:1);
  const mine=live.filter(d=>S.me&&(d.owner===S.me||d.sub===S.me));
  const max=Math.max(1,...STAGES.map((_,i)=>live.filter(d=>d.stage===i).length));
  const bars=STAGES.map((s,i)=>{const n=live.filter(d=>d.stage===i).length;
    return`<div class="row"><span>${i+1}. ${s}</span><div class="trk"><div class="fill" style="width:${n/max*100}%"></div></div><span class="num">${n}</span></div>`+(i===1?'<div class="gate">◆ Gate 1</div>':i===3?'<div class="gate">◆ Gate 2</div>':'')}).join('');
  const recent=[...S.files].sort((a,b)=>(b.at||'')>(a.at||'')?1:-1).slice(0,6);
  const row=d=>`<tr class="clk" data-go="deal-${d.id}"><td><div>${esc(d.name)}</div><div class="muted small">${esc(d.code)} · ${esc(d.assetType||'')}</div></td><td>${STAGES[d.stage]||''}${d.status==='보류'?' <span class="tag warn">보류</span>':''}</td><td>${esc(d.nextAction||'')}</td></tr>`;
  return`<div class="grid g4" style="margin-bottom:16px">
    <div class="card kpi hl"><div class="l">진행 중 딜</div><div class="v">${live.length}<small>건</small></div></div>
    <div class="card kpi"><div class="l">이번 달 신규 접수</div><div class="v">${newM}<small>건</small></div></div>
    <div class="card kpi"><div class="l">7일 내 기한</div><div class="v" style="${due.length?'color:var(--bad)':''}">${due.length}<small>건</small></div></div>
    <div class="card kpi"><div class="l">보류</div><div class="v">${hold}<small>건</small></div></div></div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card"><h3>단계별 진행 딜 <span class="muted small">Drop·종결 제외</span></h3><div class="bd bars">${live.length?bars:'<div class="empty">아직 접수된 딜이 없습니다. <a href="#intake">첫 딜을 접수</a>하세요.</div>'}</div></div>
    <div class="card"><h3>기한 임박 <span class="muted small">7일 이내·경과</span></h3>${due.length?`<table class="t">${due.slice(0,8).map(x=>`<tr class="clk" data-go="deal-${x.d.id}"><td>${esc(x.d.name)}<div class="muted small">${esc(x.d.nextAction||'회신기한')}</div></td><td class="num ${daysTo(x.dd)<0?'over':''}">${daysTo(x.dd)<0?`${-daysTo(x.dd)}일 경과`:daysTo(x.dd)===0?'오늘':`D-${daysTo(x.dd)}`}</td></tr>`).join('')}</table>`:'<div class="empty">임박한 기한이 없습니다</div>'}</div></div>
  <div class="grid g2">
    <div class="card"><h3>내 담당 딜</h3>${mine.length?`<table class="t"><tr><th>딜</th><th>단계</th><th>다음 액션</th></tr>${mine.map(row).join('')}</table>`:'<div class="empty">주·부담당으로 지정된 딜이 없습니다</div>'}</div>
    <div class="card"><h3>최근 등록 자료 <a href="#library" class="link">전체 보기</a></h3>${recent.length?`<table class="t">${recent.map(f=>{const d=deal(f.dealId);return`<tr class="clk" data-go="deal-${f.dealId}"><td>${esc(f.name)}<div class="muted small">${esc(d?d.name:'')} · ${esc(f.type)}</div></td><td class="muted small num">${dshort(f.at)}</td></tr>`}).join('')}</table>`:'<div class="empty">등록된 자료가 없습니다</div>'}</div></div>`}

/* ===================== 딜 접수 ===================== */
function peopleOpts(sel){return`<option value="">미지정</option>`+S.members.map(id=>`<option value="${esc(id)}"${id===sel?' selected':''}>${esc(nameOf(id))}${id===S.me?' (나)':''}</option>`).join('')}
function dealFormFields(d){d=d||{};return`
  <div class="f wide"><label>딜명 <span class="req">*</span></label><input name="name" required maxlength="80" value="${esc(d.name)}" placeholder="예: 세종 부강면 물류센터 개발"></div>
  <div class="f"><label>의뢰유형 <span class="req">*</span></label><select name="reqType">${opts(REQ_TYPES,d.reqType)}</select></div>
  <div class="f"><label>자산유형 <span class="req">*</span></label><select name="assetType">${opts(ASSET_TYPES,d.assetType)}</select></div>
  <div class="f wide"><label>소재지(지번) <span class="req">*</span></label><input name="address" required value="${esc(d.address)}" placeholder="예: 세종특별자치시 부강면 ○○리 123"><span class="hint">입력하면 기존 딜·Drop 아카이브와 자동으로 중복 확인합니다</span></div>
  <div class="dup" id="dupBox" style="display:none"></div>
  <div class="f"><label>대지면적 (㎡)</label><input name="landArea" inputmode="decimal" value="${esc(d.landArea)}"></div>
  <div class="f"><label>용도지역</label><input name="zoning" value="${esc(d.zoning)}" placeholder="예: 계획관리지역"></div>
  <div class="f"><label>의뢰처</label><input name="client" value="${esc(d.client)}" placeholder="시행사·토지주·금융사 등"></div>
  <div class="f"><label>소개경로</label><input name="channel" value="${esc(d.channel)}" placeholder="직접·중개법인·타 금융사 등"></div>
  <div class="f"><label>희망 조달액 (억원)</label><input name="amount" inputmode="decimal" value="${esc(d.amount)}"></div>
  <div class="f"><label>회신기한</label><input type="date" name="dueDate" value="${esc(d.dueDate)}"></div>
  <div class="f"><label>주담당</label><select name="owner">${peopleOpts(d.owner!==undefined?d.owner:S.me)}</select></div>
  <div class="f"><label>부담당</label><select name="sub">${peopleOpts(d.sub)}</select></div>
  <div class="f wide"><label>의뢰 내용·메모</label><textarea name="memo" placeholder="의뢰 조건, 특이사항">${esc(d.memo)}</textarea></div>`}
function viewIntake(){return`<div class="card" style="max-width:860px"><h3>새 딜 접수 <span class="muted small">필수 4개 항목만 채우면 등록됩니다</span></h3><div class="bd">
  <form id="intakeForm" class="form" autocomplete="off">${dealFormFields()}</form>
  <div class="formfoot"><a class="btn" href="#pipeline" style="text-decoration:none">취소</a><button class="btn pri" form="intakeForm" type="submit">접수 등록</button></div>
  <p class="muted small" style="margin:10px 0 0">등록 후 딜 카드에서 자료를 업로드하세요. 담당자 목록에는 이 포탈을 한 번 이상 연 팀원이 표시됩니다.</p></div></div>`}
function dupCheck(addr,name,exceptId){const a=norm(addr),n=norm(name);if(a.length<6&&n.length<4)return[];
  return S.deals.filter(d=>d.id!==exceptId&&((a.length>=6&&(norm(d.address).includes(a)||a.includes(norm(d.address))&&norm(d.address).length>=6))||(n.length>=4&&norm(d.name)===n)))}
function initIntake(){const f=$('#intakeForm');if(!f)return;
  const upd=()=>{const hits=dupCheck(f.address.value,f.name.value);const b=$('#dupBox');
    if(!hits.length){b.style.display='none';return}
    b.style.display='';b.innerHTML=`<b>유사 딜 ${hits.length}건이 있습니다.</b> 중복 검토인지 확인하세요.<br>`+hits.map(d=>`· <a href="#deal-${d.id}">${esc(d.code)} ${esc(d.name)}</a> — ${esc(d.address)} <span class="tag ${d.status==='Drop'?'bad':''}">${d.status==='Drop'?'Drop: '+esc(d.dropReason||''):esc(STAGES[d.stage])}</span>`).join('<br>')};
  f.addEventListener('input',e=>{setDirty(true);if(e.target.name==='address'||e.target.name==='name')upd()});
  f.addEventListener('submit',async e=>{e.preventDefault();if(!S.db)return toast('저장소에 연결되지 않았습니다');
    const fd=Object.fromEntries(new FormData(f));
    if(!fd.name.trim()||!fd.address.trim())return toast('딜명과 소재지는 필수입니다');
    const yr=today().slice(0,4);const n=S.deals.filter(d=>(d.code||'').startsWith(yr)).length+1;
    const id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const doc={...fd,name:fd.name.trim(),code:`${yr}-${String(n).padStart(3,'0')}`,stage:0,status:'진행',nextAction:'1차 스크리닝 착수',nextDue:fd.dueDate||'',
      gates:{},checklist:{},feas:{},createdAt:now(),createdBy:S.me||'',updatedAt:now(),
      log:[{at:now(),by:S.me||'',msg:'딜 접수 등록'}]};
    const btn=document.querySelector('[form=intakeForm]');btn.disabled=true;
    try{await S.db.doc('deals/'+id).set(doc);S.dirty=false;toast(`${doc.code} 접수 완료`);location.hash='deal-'+id}
    catch(err){btn.disabled=false;toast(errMsg(err))}});}

/* ===================== 파이프라인 ===================== */
function viewPipeline(){const F=S.filt;
  const list=S.deals.filter(d=>(d.status==='진행'||d.status==='보류')&&(!F.asset||d.assetType===F.asset)&&(!F.owner||d.owner===F.owner||d.sub===F.owner)&&(!F.q||(d.name+d.address+d.client+d.code).toLowerCase().includes(F.q.toLowerCase())));
  const cols=STAGES.map((s,i)=>{const ds=list.filter(d=>d.stage===i).sort((a,b)=>(a.nextDue||'9')<(b.nextDue||'9')?-1:1);
    const col=`<div class="col" data-stage="${i}"><div class="col-h">${i+1}. ${s}<span>${ds.length}</span></div><div class="col-b">${ds.map(card).join('')||''}</div></div>`;
    return col+(i===1?'<div class="gatesep">◆ GATE 1</div>':i===3?'<div class="gatesep">◆ GATE 2</div>':'')}).join('');
  return`<div class="filters"><input id="fq" placeholder="딜명·주소·의뢰처 검색" value="${esc(F.q)}" style="width:220px">
    <select id="fa">${opts(ASSET_TYPES,F.asset,'전체 자산유형')}</select>
    <select id="fo"><option value="">전체 담당자</option>${S.members.map(id=>`<option value="${esc(id)}"${id===F.owner?' selected':''}>${esc(nameOf(id))}</option>`).join('')}</select>
    <span class="muted small" style="margin-left:auto">${list.length}건 표시 · 보류 건은 주황 테두리</span></div>
    ${S.loaded.deals&&!S.deals.length?'<div class="card empty" style="margin-bottom:12px">접수된 딜이 없습니다. <a href="#intake">새 딜 접수</a></div>':''}
    <div class="kb">${cols}</div>`}
function card(d){const dd=d.nextDue||d.dueDate;const k=daysTo(dd);
  return`<div class="dc ${d.status==='보류'?'hold':''}" draggable="${S.canWrite!==false&&!!S.db}" data-id="${d.id}" data-go="deal-${d.id}">
  <div class="c">${esc(d.code)} · ${esc(d.assetType||'')} · ${esc(d.reqType||'')}</div><div class="n">${esc(d.name)}</div>
  <div class="m"><span>${esc(nameOf(d.owner))}</span><span>${d.amount?fmt(num(d.amount))+'억':''}</span></div>
  ${dd?`<div class="m" style="margin-top:4px"><span class="muted">${esc(d.nextAction||'기한')}</span><span class="${k<0?'over':''}">${k<0?`${-k}일 경과`:k===0?'오늘':'D-'+k}</span></div>`:''}</div>`}
function initKanban(){
  const fq=$('#fq');fq&&fq.addEventListener('input',()=>{S.filt.q=fq.value;clearTimeout(fq._t);fq._t=setTimeout(()=>{const p=fq.selectionStart;fq.blur();render();const n=$('#fq');n.focus();n.setSelectionRange(p,p)},250)});
  $('#fa').onchange=e=>{S.filt.asset=e.target.value;e.target.blur();render()};
  $('#fo').onchange=e=>{S.filt.owner=e.target.value;e.target.blur();render()};
  document.querySelectorAll('.dc[draggable=true]').forEach(c=>c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id)}));
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('dragover')});
    col.addEventListener('dragleave',()=>col.classList.remove('dragover'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('dragover');const d=deal(e.dataTransfer.getData('text/plain'));if(d)moveStage(d,+col.dataset.stage)})});}

/* ===================== 딜 저장·단계 이동·게이트 ===================== */
async function saveDeal(d,patch,msg){if(!S.db)return toast('저장소에 연결되지 않았습니다');
  patch={...patch,updatedAt:now()};if(msg)patch.log=[...(d.log||[]),{at:now(),by:S.me||'',msg}].slice(-100);
  try{await S.db.doc('deals/'+d.id).update(patch);return true}catch(e){toast(errMsg(e));return false}}
function moveStage(d,to){if(to===d.stage||to<0||to>6)return;
  if(to>d.stage){if(d.stage<=1&&to>=2&&d.gates?.g1?.decision!=='Go')return openGate(d,'g1',to);
    if(d.stage<=3&&to>=4&&d.gates?.g2?.decision!=='Go')return openGate(d,'g2',to)}
  saveDeal(d,{stage:to,nextAction:STAGES[to]+' 진행'},`단계 이동: ${STAGES[d.stage]} → ${STAGES[to]}`).then(ok=>ok&&toast(`${STAGES[to]} 단계로 이동`))}
function openGate(d,g,target){const isG1=g==='g1';const cur=d.gates?.[g]||{};
  const bad=CHECK.filter(c=>d.checklist?.[c.k]?.v==='부적합').map(c=>c.t);
  const un=CHECK.filter(c=>!d.checklist?.[c.k]?.v||d.checklist[c.k].v==='미검토').length;
  const fc=feasCalc(d.feas?.down);
  const info=isG1?(bad.length?`<div class="note bad">부적합 항목: ${bad.join(', ')} — 기획서 기준상 Gate 1 통과 불가</div>`:`<div class="note">체크리스트 미검토 ${un}개 / 부적합 0개</div>`)
    :`<div class="note${fc.bep!=null&&fc.bep>0.8?' bad':''}">Downside 선순위 상환 분양률: <b>${pct(fc.bep)}</b> · LTV ${pct(fc.ltv)}${fc.bep==null?' (수지 요약 미입력)':''}</div>`;
  modal(`<h3>${isG1?'Gate 1 · 1차 스크리닝 결과':'Gate 2 · 사업수지 결과'} — ${esc(d.name)}</h3><form id="gf"><div class="bd">${info}
   <div class="f" style="margin-bottom:14px"><label>결정</label><div class="radios">${['Go','보류','Drop'].map(v=>`<label><input type="radio" name="decision" value="${v}"${(cur.decision||(bad.length?'Drop':'Go'))===v?' checked':''}>${v}</label>`).join('')}</div></div>
   <div class="f" style="margin-bottom:14px"><label>사유코드 (보류·Drop 시)</label><select name="reason">${opts(DROP_CODES,cur.reason,'선택')}</select></div>
   <div class="f"><label>판단 근거 메모</label><textarea name="note" placeholder="${isG1?'예: 용도지역상 물류창고 허용, 토지 확보율 100%':'예: Downside에서도 선순위 상환 분양률 62%'}">${esc(cur.note||'')}</textarea></div>
   ${!S.canAdmin?'<p class="muted small" style="margin:10px 0 0">기획서상 최종 승인은 팀장 권한입니다. 담당자가 기록한 결정은 팀장이 히스토리에서 확인합니다.</p>':''}
  </div><div class="ft"><button type="button" class="btn" data-close>취소</button><button class="btn pri">결정 기록</button></div></form>`);
  $('#gf').onsubmit=async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));
    if(fd.decision!=='Go'&&!fd.reason)return toast('보류·Drop은 사유코드를 선택하세요');
    const rec={decision:fd.decision,reason:fd.reason||'',note:fd.note||'',by:S.me||'',at:now()};
    const label=isG1?'Gate 1':'Gate 2';let patch={gates:{[g]:rec}};
    if(fd.decision==='Go'){const nt=target!=null?(isG1?Math.min(target,3):target):(isG1?2:4);patch.stage=nt;patch.status='진행';patch.nextAction=STAGES[nt]+' 진행'}
    else if(fd.decision==='보류'){patch.status='보류'}
    else{patch.status='Drop';patch.dropReason=fd.reason;patch.dropGate=label;patch.dropAt=now()}
    const ok=await saveDeal(d,patch,`${label} ${fd.decision}${fd.reason?' ('+fd.reason+')':''}${fd.note?': '+fd.note:''}`);
    if(!ok)return;closeModal();toast(`${label} ${fd.decision} 기록`);
    if(fd.decision==='Go'&&isG1&&target!=null&&target>=4){const nd={...d,stage:3,gates:{...d.gates,g1:rec}};openGate(nd,'g2',target)}
    if(fd.decision==='Drop'&&route().name==='deal')location.hash='archive'};}
function openDrop(d){modal(`<h3>Drop 처리 — ${esc(d.name)}</h3><form id="df"><div class="bd">

    if(await saveDeal(d,{status:'Drop',dropReason:fd.reason,dropGate:STAGES[d.stage]+' 단계',dropAt:now()},`Drop (${fd.reason})${fd.note?': '+fd.note:''}`)){closeModal();toast('Drop 아카이브로 이동');location.hash='archive'}}}

function viewDeal(d){const fc=feasCalc(d.feas?.base);const g1=d.gates?.g1?.decision==='Go',g2=d.gates?.g2?.decision==='Go';
  let step='';STAGES.forEach((s,i)=>{const cls=i<d.stage?'done':i===d.stage?'cur':'';
    step+=`<div class="st ${cls}"><i>${i<d.stage?'✓':i+1}</i>${s}</div>`;
    if(i<6){step+=`<div class="ln ${i<d.stage?'done':''}"></div>`;if(i===1)step+=`<div class="gd ${g1?'go':''}" title="Gate 1"></div><div class="ln ${i+1<=d.stage?'done':''}"></div>`;if(i===3)step+=`<div class="gd ${g2?'go':''}" title="Gate 2"></div><div class="ln ${i+1<=d.stage?'done':''}"></div>`}});
  const dd=d.nextDue;const k=daysTo(dd);
  const stTag=d.status==='보류'?'<span class="tag warn">보류</span>':d.status==='Drop'?'<span class="tag bad">Drop</span>':d.status==='종결'?'<span class="tag">종결</span>':'<span class="tag acc">진행</span>';
  const tabs=[['overview','개요'],['files',`자료 (${S.files.filter(f=>f.dealId===d.id).length})`],['review','검토·게이트'],['feas','수지 요약'],['log','히스토리']];
  const body={overview:tabOverview,files:tabFiles,review:tabReview,feas:tabFeas,log:tabLog}[S.tab](d);
  return`<div class="dhead"><div><div class="t1">${esc(d.code)} · ${esc(d.reqType)} · ${esc(d.assetType)} ${stTag}</div>
    <div class="muted" style="margin-top:4px">${esc(d.address)}</div>
    <div class="small" style="margin-top:6px">주담당 <b>${esc(nameOf(d.owner))}</b> · 부담당 ${esc(nameOf(d.sub))} · 다음 액션: <b>${esc(d.nextAction||'–')}</b>${dd?` <span class="${k<0?'over':''}">(${dshort(dd)}${k<0?`, ${-k}일 경과`:''})</span>`:''}</div></div>
   <div class="acts wr">${d.status==='Drop'?`<button class="btn" data-act="reopen">재개</button>`:`
     <button class="btn sm" data-act="prev"${d.stage===0?' disabled':''}>◀ 이전 단계</button>
     <button class="btn sm pri" data-act="next"${d.stage===6?' disabled':''}>다음 단계 ▶</button>
     <button class="btn sm" data-act="hold">${d.status==='보류'?'보류 해제':'보류'}</button>
     <button class="btn sm" data-act="next-action">다음 액션</button>
     ${d.stage===6&&d.status!=='종결'?'<button class="btn sm" data-act="close-deal">종결</button>':''}
     <button class="btn sm danger" data-act="drop">Drop</button>`}</div></div>
  <div class="stepper">${step}</div>
  <div class="metrics"><div><div class="l">희망 조달액</div><div class="v">${d.amount?fmt(num(d.amount))+'억':'–'}</div></div>
   <div><div class="l">총사업비 (Base)</div><div class="v">${fc.margin!=null||num(d.feas?.base?.cost)!=null?fmt(num(d.feas.base.cost))+'억':'–'}</div></div>
   <div><div class="l">PF 합계 (Base)</div><div class="v">${fc.pf!=null?fmt(fc.pf)+'억':'–'}</div></div>
   <div><div class="l">LTV 선순위 (Base)</div><div class="v">${pct(fc.ltv)}</div></div>
   <div><div class="l">선순위 상환 분양률 (Base)</div><div class="v">${pct(fc.bep)}</div></div></div>
  <div class="tabs">${tabs.map(([k,t])=>`<a data-tab="${k}" class="${S.tab===k?'on':''}">${t}</a>`).join('')}</div>${body}`}

function fileTable(fs,showDeal){return`<table class="t"><tr>${showDeal?'<th>딜</th>':''}<th>문서유형</th><th>파일</th><th>버전</th><th>출처</th><th>등록</th><th></th></tr>${fs.map(f=>{const d=deal(f.dealId);const href=f.kind==='link'?f.url:(f.url||('/_blob/'+f.assetId));

   <td>${f.kind==='link'?`<a href="${esc(href)}" target="_blank" rel="noopener">${esc(f.name)}</a>`:`<button class="link" data-act="open-file" data-id="${f.id}">${esc(f.name)}</button>`}${f.kind==='link'?' <span class="tag acc">링크</span>':''}<div class="muted small">${esc(f.stdName||'')}${f.size?' · '+(f.size<1048576?Math.max(1,Math.round(f.size/1024))+'KB':fmt(f.size/1048576,1)+'MB'):''}${f.note?' · '+esc(f.note):''}</div></td>

  return`<tr><td style="width:110px"><b>${c.t}</b></td><td class="muted small" style="width:34%">${c.p}</td>

  const gb=(g,label,after)=>{const r=d.gates?.[g];return`<div class="gatebox"><div class="gd ${r?.decision==='Go'?'go':''}"></div><div class="tx"><b>${label}</b> <span class="muted small">(${after})</span><br>

    <button class="btn sm wr" data-act="gate" data-g="${g}">결정 기록</button></div>`};
  const bad=CHECK.filter(c=>d.checklist?.[c.k]?.v==='부적합').length,ok=CHECK.filter(c=>d.checklist?.[c.k]?.v==='적합').length,mid=CHECK.filter(c=>d.checklist?.[c.k]?.v==='보완').length;
  return`${gb('g1','Gate 1 · 진행 여부','1차 스크리닝 후 · 부적합 0개일 때 Go')}${gb('g2','Gate 2 · 진행 여부','사업수지 검토 후 · Downside 수지 기준')}

function tabFeas(d){const b=d.feas?.base||{},w=d.feas?.down||{};const cb=feasCalc(b),cw=feasCalc(w);const ro=S.canWrite===false?'disabled':'';
  const rows=FEAS.map(r=>r.sec?`<tr class="sec"><td colspan="3">${r.sec}</td></tr>`:`<tr><td>${r.t.replace(/ /g,'&nbsp;')}</td><td class="n"><input data-fs="base" name="${r.k}" value="${esc(b[r.k]??'')}" inputmode="decimal" ${ro}></td><td class="n"><input data-fs="down" name="${r.k}" value="${esc(w[r.k]??'')}" inputmode="decimal" ${ro}></td></tr>`).join('');
  const calc=(t,f)=>`<tr class="calc"><td>${t}</td><td class="n">${f(cb)}</td><td class="n">${f(cw)}</td></tr>`;
  return`<div class="grid g3"><div class="card"><h3>수지 요약 입력 <span class="muted small">단위: 억원 · 원본 수지표는 자료 탭에 업로드</span></h3><form id="fef">

   <div class="formfoot wr" style="padding:0 16px 16px"><button type="button" class="btn" data-act="copy-base">Base → Downside 복사</button><button class="btn pri">수지 요약 저장</button></div></form></div>
   <div class="card"><h3>산식</h3><div class="bd formula">

  modal(`<h3>자료 등록</h3><form id="uf"><div class="bd"><div class="form">
   <div class="f wide"><label>딜 <span class="req">*</span></label><select name="dealId" required><option value="">선택</option>${S.deals.filter(d=>d.status!=='Drop').map(d=>`<option value="${d.id}"${d.id===dealId?' selected':''}>${esc(d.code)} ${esc(d.name)}</option>`).join('')}</select></div>

    const d=deal(f.dealId);if(d)await saveDeal(d,{},`자료 삭제: ${f.type} v${f.version} (${f.name})`);closeModal();toast('삭제되었습니다')}catch(e){toast(errMsg(e))}}}

/* ===================== Drop 아카이브 ===================== */
function viewArchive(){const ds=S.deals.filter(d=>d.status==='Drop'||d.status==='종결').sort((a,b)=>(b.dropAt||b.updatedAt||'')>(a.dropAt||a.updatedAt||'')?1:-1);
  const byR=DROP_CODES.map(r=>[r,ds.filter(d=>d.status==='Drop'&&d.dropReason===r).length]).filter(x=>x[1]);
  return`${byR.length?`<div class="filters">${byR.map(([r,n])=>`<span class="tag bad">${esc(r)} ${n}</span>`).join('')}</div>`:''}
  <div class="card">${ds.length?`<table class="t"><tr><th>코드</th><th>딜명 · 소재지</th><th>상태</th><th>사유</th><th>결정 시점</th><th>담당</th><th></th></tr>${ds.map(d=>`<tr class="clk" data-go="deal-${d.id}">
   <td>${esc(d.code)}</td><td>${esc(d.name)}<div class="muted small">${esc(d.address)}</div></td><td>${d.status==='Drop'?'<span class="tag bad">Drop</span>':'<span class="tag">종결</span>'}</td>
   <td>${esc(d.dropReason||'')}</td><td class="small">${esc(d.dropGate||'')}<br><span class="muted">${dshort(d.dropAt||d.updatedAt)}</span></td><td>${esc(nameOf(d.owner))}</td>
   <td>${d.status==='Drop'?`<button class="btn sm wr" data-act="reopen" data-id="${d.id}">재개</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">Drop·종결된 딜이 없습니다</div>'}</div>`}

/* ===================== 모달 ===================== */
function modal(html){$('#dlg').innerHTML=html;$('#mask').classList.remove('hidden');const i=$('#dlg').querySelector('input,select,textarea');i&&i.focus()}
function closeModal(){$('#mask').classList.add('hidden');$('#dlg').innerHTML='';if(S.pending&&!S.dirty)render()}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask'||e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#mask').classList.contains('hidden'))closeModal()});

/* ===================== 이벤트 위임 ===================== */
$('#view').addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab]');if(t){S.tab=t.dataset.tab;S.editOverview=false;S.dirty=false;render();return}
  const a=e.target.closest('[data-act]');
  if(a){const r=route();const d=r.name==='deal'?deal(r.id):deal(a.dataset.id);const act=a.dataset.act;e.stopPropagation();
    if(act==='upload')return openUpload(a.dataset.deal||'');
    if(act==='open-file')return openFile(S.files.find(x=>x.id===a.dataset.id));
    if(act==='del-file'){const f=S.files.find(x=>x.id===a.dataset.id);return f&&confirmDel(f)}
    if(!d)return;
    if(act==='next')return moveStage(d,d.stage+1);
    if(act==='prev')return moveStage(d,d.stage-1);
    if(act==='hold')return saveDeal(d,{status:d.status==='보류'?'진행':'보류'},d.status==='보류'?'보류 해제':'보류 처리');
    if(act==='drop')return openDrop(d);
    if(act==='reopen')return saveDeal(d,{status:'진행',dropReason:'',dropGate:'',dropAt:''},'Drop 해제(재개)').then(ok=>ok&&toast('파이프라인으로 복귀'));
    if(act==='close-deal')return saveDeal(d,{status:'종결'},'딜 종결').then(ok=>ok&&toast('종결 처리'));
    if(act==='gate')return openGate(d,a.dataset.g,null);
    if(act==='ov-edit'){S.editOverview=true;render();return}
    if(act==='ov-cancel'){S.editOverview=false;setDirty(false);render();return}
    if(act==='copy-base'){document.querySelectorAll('input[data-fs=base]').forEach(i=>{const o=document.querySelector(`input[data-fs=down][name=${i.name}]`);if(o)o.value=i.value});setDirty(true);return}
    if(act==='next-action'){modal(`<h3>다음 액션 설정</h3><form id="naf"><div class="bd"><div class="f" style="margin-bottom:12px"><label>다음 액션</label><input name="na" value="${esc(d.nextAction||'')}"></div><div class="f"><label>기한</label><input type="date" name="nd" value="${esc(d.nextDue||'')}"></div></div><div class="ft"><button type="button" class="btn" data-close>취소</button><button class="btn pri">저장</button></div></form>`);
      $('#naf').onsubmit=async ev=>{ev.preventDefault();const fd=Object.fromEntries(new FormData(ev.target));if(await saveDeal(d,{nextAction:fd.na,nextDue:fd.nd},`다음 액션: ${fd.na}${fd.nd?' ('+fd.nd+')':''}`))closeModal()};return}
    return}
  const g=e.target.closest('[data-go]');if(g&&!e.target.closest('a,button,input,select'))location.hash=g.dataset.go;
});
$('#view').addEventListener('change',e=>{const r=route();const d=r.name==='deal'&&deal(r.id);
  if(r.name==='library'){if(e.target.id==='lfd'){S.libf.deal=e.target.value;e.target.blur();render()}if(e.target.id==='lft'){S.libf.type=e.target.value;e.target.blur();render()}return}
  if(!d)return;
  if(e.target.dataset.ck){const k=e.target.dataset.ck,v=e.target.value;e.target.className='v-'+v;
    saveDeal(d,{checklist:{[k]:{v}}},`체크리스트 ${CHECK.find(c=>c.k===k).t}: ${v}`);e.target.blur()}
  else if(e.target.dataset.ckc!==undefined){const k=e.target.dataset.ckc,c=e.target.value;if((d.checklist?.[k]?.c||'')!==c)saveDeal(d,{checklist:{[k]:{c}}})}
});
$('#view').addEventListener('input',e=>{if(e.target.closest('#ovf,#fef'))setDirty(true)});
$('#view').addEventListener('submit',async e=>{const r=route();const d=r.name==='deal'&&deal(r.id);if(!d)return;
  if(e.target.id==='ovf'){e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));if(!fd.name.trim()||!fd.address.trim())return toast('딜명과 소재지는 필수입니다');
    const ch=Object.keys(fd).filter(k=>(d[k]??'')!==fd[k]);if(!ch.length){S.editOverview=false;setDirty(false);return render()}
    if(await saveDeal(d,fd,`개요 수정: ${ch.length}개 항목`)){S.editOverview=false;setDirty(false);render();toast('저장되었습니다')}}
  if(e.target.id==='fef'){e.preventDefault();const feas={base:{},down:{}};e.target.querySelectorAll('input[data-fs]').forEach(i=>{const v=i.value.trim();if(v!==''&&num(v)==null)return;feas[i.dataset.fs][i.name]=v===''?'':String(num(v))});
    const c=feasCalc(feas.base),w=feasCalc(feas.down);
    if(await saveDeal(d,{feas},`수지 요약 저장 (Base 이익률 ${pct(c.margin)}, Downside 상환 분양률 ${pct(w.bep)})`)){setDirty(false);render();toast('수지 요약 저장')}}
});

/* ===================== 로컬 저장소 (localStorage + IndexedDB) ===================== */
const LS_KEY='pfportal:data:v1', ME_KEY='pfportal:me';
const newId=p=>(p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const Local=(()=>{
  const load=()=>{try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch(e){return{}}};
  let data=load();const subs={};
  const clone=v=>JSON.parse(JSON.stringify(v));
  const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){throw{code:'quota_exceeded'}}};
  const merge=(a,b)=>{const o={...a};for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?merge(o[k],v):v}return o};
  const snap=c=>{const o=data[c]||{};const docs=Object.keys(o).map(id=>({id,exists:true,data:()=>o[id],metadata:{fromCache:false,hasPendingWrites:false}}));
    return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}};
  const emit=c=>(subs[c]||new Set()).forEach(fn=>{try{fn(snap(c))}catch(e){console.error(e)}});
  const doc=path=>{const[c,id]=path.split('/');return{id,path,
    async get(){const v=data[c]?.[id];return{id,exists:!!v,data:()=>v,metadata:{}}},
    async set(v){(data[c]=data[c]||{})[id]=clone(v);save();emit(c)},
    async update(v){if(!data[c]?.[id])throw{code:'invalid_argument'};data[c][id]=merge(data[c][id],clone(v));save();emit(c)},
    async delete(){if(data[c]){delete data[c][id];save();emit(c)}}}};
  const collection=c=>({path:c,doc:id=>doc(c+'/'+(id||newId())),
    async add(v){const d=doc(c+'/'+newId());await d.set(v);return d},
    onSnapshot(fn){(subs[c]=subs[c]||new Set()).add(fn);setTimeout(()=>fn(snap(c)),0);return()=>subs[c].delete(fn)}});
  /* 같은 PC의 다른 탭과 동기화 */
  window.addEventListener('storage',e=>{if(e.key===LS_KEY){data=load();Object.keys(subs).forEach(emit)}});
  return{doc,collection,raw:()=>clone(data),replace(d){data=d||{};save();Object.keys(subs).forEach(emit)}};
})();
const Blobs={_db:null,
  open(){return this._db||(this._db=new Promise((res,rej)=>{const r=indexedDB.open('pfportal-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f',mode);const st=t.objectStore('f');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  put(id,b){return this.tx('readwrite',s=>s.put(b,id))},get(id){return this.tx('readonly',s=>s.get(id))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},clear(){return this.tx('readwrite',s=>s.clear())}};
const LocalAssets={async upload(file){const id=newId('f');await Blobs.put(id,file);return{id,sizeBytes:file.size,contentType:file.type||''}},delete(id){return Blobs.del(id)}};

async function openFile(f){if(!f)return;try{const b=await Blobs.get(f.assetId);if(!b)return toast('이 PC에 파일 본문이 없습니다 (다른 PC에서 등록된 자료). 백업 파일을 불러오세요');
  const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;
  if(/pdf|image|text/.test(f.contentType||b.type||''))a.target='_blank';else a.download=f.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){toast('파일을 열 수 없습니다')}}

/* ===================== 사용자 (로그인 없이 이름으로 구분) ===================== */
function refreshMe(){$('#meName').textContent=S.me?nameOf(S.me):'미설정'}
function openUser(force){const opt=S.members.map(id=>`<option value="${esc(id)}"${id===S.me?' selected':''}>${esc(nameOf(id))}</option>`).join('');
  modal(`<h3>${force?'처음 오셨네요 — 사용자 설정':'사용자 변경'}</h3><form id="usf"><div class="bd">
   ${S.members.length?`<div class="f" style="margin-bottom:14px"><label>기존 팀원 선택</label><select name="pick"><option value="">— 새 이름 입력 —</option>${opt}</select></div>`:''}
   <div class="f"><label>새 이름</label><input name="nm" maxlength="20" placeholder="예: 홍길동 부장"></div>
   <p class="muted small" style="margin:10px 0 0">담당자 지정과 히스토리 기록에 쓰입니다. 비밀번호는 없습니다.</p></div>
   <div class="ft">${force?'':'<button type="button" class="btn" data-close>취소</button>'}<button class="btn pri">확인</button></div></form>`);
  $('#usf').onsubmit=async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));let id=fd.pick||'';
    if(!id){const nm=(fd.nm||'').trim();if(!nm)return toast('이름을 입력하세요');
      id=S.members.find(m=>nameOf(m)===nm)||newId('u');await Local.doc('members/'+id).set({name:nm,joinedAt:now()})}
    S.me=id;try{localStorage.setItem(ME_KEY,id)}catch(e){}closeModal();refreshMe();render()}}
$('#btnUser').onclick=()=>openUser(false);

/* ===================== 백업 내보내기 / 불러오기 ===================== */
const b64=blob=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
$('#btnExport').onclick=async()=>{const data=Local.raw();const blobs={};
  for(const f of Object.values(data.files||{}))if(f.assetId){const b=await Blobs.get(f.assetId);if(b)blobs[f.assetId]=await b64(b)}
  const out=new Blob([JSON.stringify({app:'pf-portal',version:1,exportedAt:now(),data,blobs})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download=`PF포탈_백업_${today().replace(/-/g,'')}.json`;document.body.appendChild(a);a.click();a.remove();
  toast('백업 파일을 저장했습니다')};
$('#btnImport').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  modal(`<h3>백업 불러오기</h3><div class="bd"><div class="note bad">현재 이 PC의 포탈 데이터를 ‘${esc(file.name)}’ 내용으로 <b>모두 교체</b>합니다. 필요하면 먼저 백업 내보내기를 하세요.</div></div>
   <div class="ft"><button class="btn" data-close>취소</button><button class="btn danger" id="doImp">교체</button></div>`);
  $('#doImp').onclick=async()=>{try{const j=JSON.parse(await file.text());if(j.app!=='pf-portal'||!j.data)throw 0;
      await Blobs.clear();for(const[id,url]of Object.entries(j.blobs||{})){await Blobs.put(id,await (await fetch(url)).blob())}
      Local.replace(j.data);closeModal();toast('백업을 불러왔습니다');if(S.me&&!(j.data.members||{})[S.me])openUser(true)}
    catch(err){toast('올바른 포탈 백업 파일이 아닙니다')}}};

/* ===================== 시작 ===================== */
function boot(){S.db=Local;S.assets=LocalAssets;S.user=null;S.dbChecked=true;S.canWrite=true;S.canAdmin=true;
  try{S.me=localStorage.getItem(ME_KEY)||null}catch(e){S.me=null}
  setSync('ok','이 PC에 저장');let first=true;
  Local.collection('deals').onSnapshot(s=>{S.deals=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.code||'')<(b.code||'')?1:-1);S.loaded.deals=true;scheduleRender()});
  Local.collection('files').onSnapshot(s=>{S.files=s.docs.map(x=>({id:x.id,...x.data()}));S.loaded.files=true;scheduleRender()});
  Local.collection('members').onSnapshot(s=>{S.members=s.docs.map(x=>x.id);S.names={};s.docs.forEach(x=>S.names[x.id]=x.data().name);refreshMe();scheduleRender();
    if(first){first=false;if(!S.me||!S.names[S.me])openUser(true)}});
  render()}
boot();
</script>
